[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# Deploy scripts read the EIP-6551 canonical registry creation code from script/data and the per-chain explorer
# settings from dashboard/chains.json (see DeployCommon.sol).
fs_permissions = [{ access = "read", path = "./script/data" }, { access = "read", path = "./dashboard/chains.json" }]

[fmt]
line_length = 120
