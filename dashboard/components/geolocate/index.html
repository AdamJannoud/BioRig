<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- BioRig geolocation button. Static Streamlit component (no build step): it speaks the component protocol
     directly over postMessage and returns {lat, lng, accuracy, ts} or {error, ts}. Author: Adam Jannoud. -->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    background: #FCFF52; color: #1A1C00; font: 700 14px/1 inherit; font-family: inherit; border: 0;
    border-radius: 11px; padding: 13px 20px; box-shadow: 0 1px 2px rgba(2, 58, 36, .12); min-height: 44px; }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button[disabled] { opacity: .6; cursor: progress; }
  #status { margin: 8px 0 2px; font-size: 13px; color: var(--muted); min-height: 1.45em; }
  #status.err { color: var(--bad); }
  @media (max-width: 520px) { button { width: 100%; } }
</style>
</head>
<body>
<button id="go" type="button"></button>
<div id="status" role="status" aria-live="polite"></div>
<script>
(function () {
  const btn = document.getElementById("go");
  const status = document.getElementById("status");
  let args = {};

  function send(type, data) {
    window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data || {}), "*");
  }
  function height() { send("streamlit:setFrameHeight", {height: Math.ceil(document.body.scrollHeight) + 2}); }
  function say(text, isError) { status.textContent = text || ""; status.className = isError ? "err" : ""; height(); }
  function done(value) { btn.disabled = false; send("streamlit:setComponentValue", {value: value, dataType: "json"}); }

  window.addEventListener("message", function (event) {
    const msg = event.data || {};
    if (msg.type !== "streamlit:render") return;
    args = msg.args || {};
    const theme = msg.theme || {};
    const dark = theme.base === "dark";
    document.body.style.setProperty("--text", theme.textColor || (dark ? "#E9F1EA" : "#0F1D17"));
    document.body.style.setProperty("--muted", dark ? "#9FB5A6" : "#5B6B62");
    document.body.style.setProperty("--bad", dark ? "#f87171" : "#b42318");
    document.body.style.setProperty("--focus", dark ? "#8FE0AC" : "#0A5B3A");
    btn.textContent = args.label || "Use my location";
    height();
  });

  btn.addEventListener("click", function () {
    if (!("geolocation" in navigator)) { say(args.unsupported, true); done({error: "unsupported", ts: Date.now()}); return; }
    btn.disabled = true;
    say(args.waiting);
    navigator.geolocation.getCurrentPosition(function (pos) {
      const c = pos.coords;
      say((args.found || "").replace("{accuracy}", Math.round(c.accuracy)));
      done({lat: c.latitude, lng: c.longitude, accuracy: c.accuracy, ts: Date.now()});
    }, function (err) {
      const denied = err && err.code === 1;
      say(denied ? args.denied : args.unavailable, true);
      done({error: denied ? "denied" : "unavailable", ts: Date.now()});
    }, {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});
  });

  send("streamlit:componentReady", {apiVersion: 1});
  height();
})();
</script>
</body>
</html>
